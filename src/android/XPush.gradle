
buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven {url 'https://developer.huawei.com/repo/'}
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.0'
        classpath 'com.google.gms:google-services:4.3.2'
    }
}

repositories{
   flatDir {
    dirs 'lib/android/xpush_android_lib/', 'src/main/lib/android/xpush_android_lib/'
   }
    maven {url 'https://developer.huawei.com/repo/'}
}

  dependencies {

     implementation(name:'XtremePush_lib', ext:'aar')
     implementation 'com.google.code.gson:gson:2.13.2'
      implementation 'com.squareup.okhttp3:okhttp:5.3.2'
     implementation 'com.squareup:otto:1.3.8'

     //firebase
      implementation 'com.huawei.hms:push:6.13.0.301'
      implementation 'com.huawei.hms:hmscoreinstaller:6.13.0.301'

     //if location
//     implementation 'com.google.android.gms:play-services-location:21.3.0'
//     implementation 'org.altbeacon:android-beacon-library:2.19.2'

     implementation 'androidx.security:security-crypto:1.1.0'
     implementation 'com.google.crypto.tink:tink-android:1.20.0'

     implementation 'androidx.work:work-runtime:2.11.0'


     //if ads
     //compile 'com.google.android.gms:play-services-ads:17.1.2'
  }

ext.postBuildExtras = {
    apply plugin: 'com.huawei.agconnect'
}

 android {
    packagingOptions {
      exclude 'META-INF/NOTICE'
      exclude 'META-INF/LICENSE'
    }
 }